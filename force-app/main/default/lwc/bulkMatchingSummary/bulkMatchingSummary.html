<template>
    <lightning-card title="Bulk Emissions Factor Matching" icon-name="standard:data_mapping">
        <div slot="actions" class="slds-p-right_small">
            <lightning-button-icon
                icon-name={fullScreenIcon}
                alternative-text={fullScreenLabel}
                title={fullScreenLabel}
                onclick={handleToggleFullScreen}
                variant="border-filled">
            </lightning-button-icon>
        </div>
        <div class="slds-p-around_medium">
            
            <!-- Status Section -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div>
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Status</h3>
                        <span class={statusClass}>{statusLabel}</span>
                    </div>
                    <div>
                        <lightning-button
                            label="Match All Items"
                            variant="brand"
                            icon-name="utility:search"
                            onclick={handleStartMatching}
                            disabled={isStartButtonDisabled}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button
                            label="Refresh"
                            variant="neutral"
                            icon-name="utility:refresh"
                            onclick={handleRefresh}
                            disabled={isLoading}
                            title="Refresh status and data">
                        </lightning-button>
                    </div>
                </div>
                
                <!-- Progress Bar (if in progress) -->
                <template if:true={isInProgress}>
                    <div class="slds-m-top_small">
                        <div class="slds-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={progressPercentage}>
                            <span class="slds-progress-bar__value" style={progressBarStyle}>
                                <span class="slds-assistive-text">{progressPercentage}% complete</span>
                            </span>
                        </div>
                        <template if:true={matchingStatus}>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                Processing {matchingStatus.processedItems} of {matchingStatus.totalItems} items...
                            </p>
                        </template>
                        <template if:false={matchingStatus}>
                            <p class="slds-text-body_small slds-m-top_x-small">
                                Starting bulk matching...
                            </p>
                        </template>
                    </div>
                </template>
            </div>
            
            <!-- Statistics Section -->
            <template if:true={matchingStatus}>
                <template if:true={matchingStatus.complete}>
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-4">
                            <div class="slds-box slds-theme_shade slds-text-align_center">
                                <div class="slds-text-heading_large">{matchingStatus.processedItems}</div>
                                <div class="slds-text-body_small slds-text-color_weak">Items Processed</div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <div class="slds-box slds-theme_success slds-text-align_center">
                                <div class="slds-text-heading_large">{matchingStatus.matchedItems}</div>
                                <div class="slds-text-body_small slds-text-color_weak">Matched</div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <div class="slds-box slds-theme_warning slds-text-align_center">
                                <div class="slds-text-heading_large">{matchingStatus.needsReviewItems}</div>
                                <div class="slds-text-body_small slds-text-color_weak">Need Review</div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <div class="slds-box slds-theme_info slds-text-align_center">
                                <div class="slds-text-heading_large">{costSavedFormatted}</div>
                                <div class="slds-text-body_small slds-text-color_weak">Cost Saved</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Cost Optimization Metrics -->
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Cost Optimization</h3>
                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <span class="slds-text-heading_medium">{cacheHitsDisplay}</span>
                                <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">Cache Hits</span>
                            </div>
                            <div>
                                <span class="slds-text-heading_medium">{deduplicatedDisplay}</span>
                                <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">Deduplicated</span>
                            </div>
                            <div>
                                <span class="slds-text-heading_medium">{llmCallsDisplay}</span>
                                <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">LLM Calls</span>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
            
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
                </div>
            </template>
            
            <!-- Review Progress Section -->
            <template if:true={matchingStatus}>
                <template if:true={matchingStatus.complete}>
                    <template if:true={matchingStatus.needsReviewItems}>
                        <div class="slds-box slds-theme_shade slds-m-top_medium slds-m-bottom_medium">
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                <div>
                                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Review Progress</h3>
                                    <p class="slds-text-body_small">{reviewProgressText}</p>
                                </div>
                                <div>
                                    <span class="slds-text-heading_medium">{reviewProgressPercentage}%</span>
                                    <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">Complete</span>
                                </div>
                            </div>
                            <div class="slds-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={reviewProgressPercentage}>
                                <span class="slds-progress-bar__value" style={reviewProgressBarStyle}>
                                    <span class="slds-assistive-text">{reviewProgressPercentage}% reviewed</span>
                                </span>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
            
            <!-- Items Needing Review -->
            <template if:true={hasItemsNeedingReview}>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">Items Needing Review</h3>
                        <div>
                            <lightning-button
                                label="Mark Selected as Reviewed"
                                variant="brand"
                                icon-name="utility:check"
                                onclick={handleMarkAsReviewed}
                                disabled={isActionButtonsDisabled}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Skip Selected"
                                variant="neutral"
                                icon-name="utility:forward"
                                onclick={handleMarkAsSkipped}
                                disabled={isActionButtonsDisabled}>
                            </lightning-button>
                        </div>
                    </div>
                    <lightning-datatable
                        key-field="Id"
                        data={itemsNeedingReview}
                        columns={reviewTableColumns}
                        onrowselection={handleRowSelection}
                        onrowaction={handleRowAction}
                        selected-rows={selectedRows}
                        wrap-text-max-width="100%">
                    </lightning-datatable>
                </div>
            </template>
            
            <!-- Lookup Modal -->
            <template if:true={showLookupModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-labelledby="lookup-modal-heading" aria-modal="true">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeLookupModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="lookup-modal-heading" class="slds-modal__title slds-hyphenate">Select Emissions Factor</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium" id="lookup-modal-content">
                            <template if:true={currentEditingItem}>
                                <c-factor-set-item-lookup
                                    value={currentEditingItem.PcmtEmssnFctrSetItemId}
                                    factor-set-id={factorSetId}
                                    item-id={currentEditingItem.Id}
                                    display-name={currentEditingItem.factorSetItemDisplayName}
                                    onchange={handleLookupChange}>
                                </c-factor-set-item-lookup>
                            </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeLookupModal}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
            
            <!-- No Items Needing Review -->
            <template if:false={hasItemsNeedingReview}>
                <template if:true={matchingStatus}>
                    <template if:true={matchingStatus.complete}>
                        <div class="slds-box slds-theme_success slds-text-align_center slds-p-around_medium">
                            <p class="slds-text-heading_small">All items have been matched!</p>
                            <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                                {matchingStatus.matchedItems} items were automatically matched with high confidence.
                            </p>
                        </div>
                    </template>
                </template>
            </template>
            
        </div>
    </lightning-card>
</template>
